[project]
name = "levbench"
version = "0.1.0"
description = "Benchmark harness for System One decision models (Jev and compatible servers)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
keywords = ["benchmark", "calibration", "decision model", "system one", "jev"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typesafe-sdk>=0.7.0",
    "system-one-adapter[anthropic]>=0.2.0",
    "python-dotenv>=1.2.3",
]

[project.optional-dependencies]
demo = ["rich>=13"]

[project.urls]
Homepage = "https://github.com/Abhinavexists/lev"
Issues = "https://github.com/Abhinavexists/lev/issues"

[project.scripts]
levbench = "levbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/levbench"]
