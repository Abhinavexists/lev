[project]
name = "levbench"
version = "0.1.0"
description = "Benchmark harness for System One decision models (Jev and compatible servers)"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "typesafe-sdk>=0.7.0",
    "system-one-adapter[anthropic]>=0.2.0",
]

[project.optional-dependencies]
# The Snake demo's terminal display. Without it the demo prints status lines.
demo = ["rich>=13"]

[project.scripts]
levbench = "levbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/levbench"]
