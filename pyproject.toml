[project]
name = "lev-4b"
version = "0.1.2"
description = "an open System One decision model"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "levbench",
    "lev",
]

[project.optional-dependencies]
train = ["lev[train]"]
serve = ["lev[serve]"]
modal = ["lev[modal]"]
demo = ["levbench[demo]"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.14",
    "modal>=1.0",
]

[tool.uv.sources]
levbench = { workspace = true }
lev = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[tool.pytest.ini_options]
pythonpath = ["packages/levbench/src"]
testpaths = ["packages/levbench/tests", "packages/lev/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
